name: Publish

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.3.0)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version-file: ".deno-version"

      - name: Publish (dry run)
        if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
        run: deno publish --dry-run

      - name: Publish
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: deno publish
